version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Denver
    open-pull-requests-limit: 5
    # These releases drop Python 3.10, which Caelus still supports.
    # Revisit these ceilings when raising the application's minimum Python.
    ignore:
      - dependency-name: starlette
        versions: [">=1.8.0"]
      - dependency-name: pillow
        versions: [">=13.0.0"]
    groups:
      python-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: America/Denver
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
